name: Publish OpenCheps Bot 0.4.0
on:
  push:
    branches: [release-v0.4.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tested source build
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/40491702767 --jq '.conclusion + " " + .head_sha' > /tmp/tested-run
          test "$(cat /tmp/tested-run)" = 'success 4c00dc45c4b1574b4e8f3dcd1fb2958757f7e045'
      - uses: actions/download-artifact@v4
        with:
          name: opencheps-arm64-v8a-debug
          run-id: 40491702767
          github-token: ${{ github.token }}
          path: release-assets
      - name: Prepare exactly the APK already delivered to the user
        run: |
          set -euo pipefail
          mv release-assets/app-arm64-v8a-debug.apk release-assets/OpenCheps_Bot_0.4.0.apk
          cd release-assets
          echo '8ec2ded53fdb6c3bc841000d2d5392ed033568de9fff6b512c6ab006acb714d7  OpenCheps_Bot_0.4.0.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cp ../LICENSE OpenCheps_LICENSE.txt
          cp ../release/v0.4.0/THIRD_PARTY_NOTICES.txt .
          curl --fail --location --retry 2 -o Stockfish_COPYING.txt https://raw.githubusercontent.com/official-stockfish/Stockfish/sf_18/Copying.txt
      - name: Upload before publishing the public experimental release
        run: |
          set -euo pipefail
          gh release create v0.4.0 --target 4c00dc45c4b1574b4e8f3dcd1fb2958757f7e045 --title 'OpenCheps Bot 0.4.0 - быстрый анализ и новый интерфейс' --notes-file release/v0.4.0/notes.md --draft --prerelease
          gh release upload v0.4.0 release-assets/*
          gh release edit v0.4.0 --draft=false --prerelease
          gh release view v0.4.0 --json url,isDraft,isPrerelease,assets
