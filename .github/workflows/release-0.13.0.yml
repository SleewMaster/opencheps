name: Publish OpenCheps Bot 0.13.0
on:
  push:
    branches: [release-v0.13.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-opencheps-v0.13.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the successful tested source build
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/41057424112 --jq '.status + " " + .conclusion + " " + .head_sha' > /tmp/opencheps-tested-run
          test "$(cat /tmp/opencheps-tested-run)" = 'completed success 60c537dcedfdf26d3fe447a427ac1532b96c787f'
      - uses: actions/download-artifact@v4
        with:
          name: opencheps-arm64-v8a-debug
          run-id: 41057424112
          github-token: ${{ github.token }}
          path: release-assets
      - name: Prepare the exact tested APK and licenses
        run: |
          set -euo pipefail
          mv release-assets/app-arm64-v8a-debug.apk release-assets/OpenCheps_Bot_0.13.0.apk
          cd release-assets
          echo '8c4f8e79631c4a4a105ae4dceb11ae312451ad55e60ed1e3acdf101990f17e91  OpenCheps_Bot_0.13.0.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          zip -q OpenCheps_Bot_0.13.0.zip OpenCheps_Bot_0.13.0.apk
          sha256sum OpenCheps_Bot_0.13.0.zip >> SHA256SUMS.txt
          cp ../LICENSE OpenCheps_LICENSE.txt
          cp ../licenses/Stockfish-Copying.txt Stockfish_COPYING.txt
          cp ../release/v0.13.0/THIRD_PARTY_NOTICES.txt .
      - name: Publish experimental release with all assets attached
        run: |
          set -euo pipefail
          if gh release view v0.13.0 --json isDraft --jq '.isDraft' > /tmp/opencheps-existing-draft 2>/dev/null; then
            test "$(cat /tmp/opencheps-existing-draft)" = 'true'
            test "$(gh api repos/$GH_REPO/git/ref/tags/v0.13.0 --jq '.object.sha')" = '60c537dcedfdf26d3fe447a427ac1532b96c787f'
          else
            gh release create v0.13.0 --target 60c537dcedfdf26d3fe447a427ac1532b96c787f --title 'OpenCheps Bot 0.13.0 — подсветка ходов больше не блокирует камеру' --notes-file release/v0.13.0/notes.md --draft --prerelease
          fi
          gh release upload v0.13.0 release-assets/* --clobber
          gh release edit v0.13.0 --draft=false --prerelease
          gh release view v0.13.0 --json url,isDraft,isPrerelease,assets
      - name: Verify unauthenticated public APK download
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/OpenCheps_Bot_0.13.0.apk https://github.com/SleewMaster/opencheps/releases/download/v0.13.0/OpenCheps_Bot_0.13.0.apk
          cd /tmp
          echo '8c4f8e79631c4a4a105ae4dceb11ae312451ad55e60ed1e3acdf101990f17e91  OpenCheps_Bot_0.13.0.apk' | sha256sum -c -
